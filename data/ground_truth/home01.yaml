# Ground truth for home01. Rules and how-to-measure: see TEMPLATE.yaml.
#
# UNITS: centimetres, nearest 0.5 cm.
# WALL NUMBERING: W1 = wall with the room's main door. Stand inside facing W1;
#                 W2 = wall on your RIGHT, then W3, W4 continuing the same way.
# Rectangular room: W1 and W3 are opposite (should be about equal), W2 and W4 too.

property_id: home01
measured_by: Ashish Kumar
date: 2026-10-04
tool: laser           # tape | laser

rooms:
  - id: bedroom1      # must match the photo folder name
    label: Bedroom 1
    ceiling_height_cm: [279, 279.5]          # two different spots
    walls:
      - {id: W1, length_cm: 239}         # wall with the door
      - {id: W2, length_cm: 289}         # to your right when facing W1
      - {id: W3, length_cm: 239}         # opposite the door
      - {id: W4, length_cm: 294}
    openings:
      - {id: O1, type: door, wall: W1, width_cm: 90, height_cm: 211, connects_to: hall}
      - {id: O2, type: window, wall: W3, width_cm: 90, height_cm: 121, sill_cm: 93}
    damage:
      # - {id: D1, wall: W2, type: crack, length_cm: 15, height_from_floor_cm: 120}
      # Raw: on W2, 35 x 50 cm, 55 cm from floor, 85 cm from the W3 corner.
      # Facing W2 from inside, W1 corner is LEFT, W3 corner is RIGHT, so
      # from_left = 289 - 85 - 50 = 154 (assumes 50 = horizontal, 85 = to the stain's near edge).
      - {id: D1, class: water_stain, wall: W2, width_cm: 50, height_cm: 35, from_left_cm: 154, from_floor_cm: 55}

  - id: hall
    label: Hallway
    ceiling_height_cm: [280, 280.5]
    # L-shaped (user, 2026-10-04): a passage runs along the bedroom wall at the north end; the KITCHEN is
    # in the north-west corner and is OPEN to the passage (no wall on W5, user 19:50).
    # Clockwise from W1 seen from above (W1 = bedroom-door wall, as originally measured):
    #
    #            W6 (passage end)
    #   +-------+----+
    #   |kitchen:    |                    : = W5 is OPEN (open kitchen, no wall)
    #   +-------+    |
    #   |   W4       |  W1  (shared with bedroom1, bedroom door)
    #   W3           |
    #   |            |
    #   +----- W2 ---+
    #
    # Plan wall numbers (out/plan.png) differ until doors are detected (step 1.7 makes W1 = main-door wall):
    #   ground truth  W1    W2    W3    W4    W5(open)  W6
    #   plan          W6    W1    W2    W3    W4(open)  W5
    # null = not measured yet. First measured as a 4-wall room: W1 361, W2 370, W3 230, W4 369.5.
    walls:
      - {id: W1, length_cm: 361}                # east, shared with bedroom1 (bedroom door), full length incl. the passage
      - {id: W2, length_cm: 370}                # south
      - {id: W3, length_cm: 230}                # west
      - {id: W4, length_cm: null}               # north, west corner to the passage: wall to the kitchen (plan ~2.68 m)
      - {id: W5, length_cm: null, kind: open}   # passage side facing the kitchen: OPEN, no wall. Measure corner to corner (plan ~1.30 m)
      - {id: W6, length_cm: null}               # passage end (plan ~1.04 m)
    checks:
      # the first "W4 = 369.5" was measured straight across the passage mouth: W4 + width of the passage (= W6)
      - {sum: [W4, W6], length_cm: 369.5}
    openings:
      - {id: O1, type: door, wall: W1, width_cm: 90, height_cm: 211, connects_to: bedroom1}
      # kitchen: no opening entry; the whole of W5 is open (kind: open)
      # - {id: O3, type: door, wall: ?, width_cm: null, height_cm: null, connects_to: bathroom}   # sticker door: wall + size to measure
      - {id: O4, type: door, wall: W3, width_cm: 89, height_cm: 210, connects_to: outside}       # carved front door: confirm wall (photos 4891/4897 show it beside the bedroom door)
      # - {id: O5, type: window, wall: ?, width_cm: null, height_cm: null, sill_cm: null}       # window beside the sticker door
    damage: []

  - id: kitchen
    label: Kitchen
    captured: true                   # photos/kitchen/ (3 photos, 2026-10-04 16:05; IMG_4900 auto-dropped as misplaced)
    # North-west corner of the flat, OPEN to the hall's passage on W1 (no wall, user 19:50). Its south wall is the
    # partition with the hall (hall W4), its west wall is on the hall's west line, its north wall on the flat's north line.
    # Plan values in comments are ONLY a guide for measuring. Never copy them in: ground truth must be tape/laser,
    # or the evaluation would grade the pipeline against itself.
    #   ground truth  W1(open)  W2    W3    W4
    #   plan          W4(open)  W1    W2    W3
    ceiling_height_cm: [null, null]  # plan: 2.74 m (floor not seen in the photos; measured from the shared floor, D27)
    walls:
      - {id: W1, length_cm: null, kind: open}   # east, OPEN to the hall's passage                 plan guide ~1.18 m
      - {id: W2, length_cm: null}               # south (partition with the hall, back of hall W4)  plan guide ~2.68 m
      - {id: W3, length_cm: null}               # west                                              plan guide ~1.18 m
      - {id: W4, length_cm: null}               # north                                             plan guide ~2.68 m
    openings: []                     # the open side W1 replaces an opening
    damage: []

repeat_captures: []

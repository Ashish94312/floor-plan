# Every threshold the pipeline uses lives here (ARCHITECTURE §12). CLI flags override.

ingest:
  image_extensions: [.heic, .heif, .jpg, .jpeg, .png]
  min_images_per_room: 2
  max_images_per_room: 8          # more -> keep the sharpest N, warn
  working_max_side: 1024          # long side of the in-memory copy (backbone 518, detector 960)
  mixed_orientation: drop_minority  # one orientation per room (E7); minority shots dropped with a warning
  intrinsics:
    film_diagonal_mm: 43.27       # 35 mm-equivalent focal is defined on the film DIAGONAL (D18)
    default_f35_mm: 26.0          # iPhone main (1x) camera; used only if EXIF has no focal, with a warning
    main_lens_f35_range_mm: [22, 30]  # outside this -> not the 1x lens (0.5x / 2x / 3x / digital zoom), warn

geometry:
  backbone: mapanything
  amp_dtype: fp16                # MPS-friendly; bf16/fp32 also accepted by MapAnything
  memory_efficient: true
  joint: auto                    # auto: one joint run over all rooms if <= max_joint_views photos, else per room
                                 # joint shares one metric scale across rooms and ties rooms together (E9, E15)
  max_joint_views: 20            # measured peak: 14 views 8.1 GB, 17 views 9.14 GB (~0.35 GB/view) -> 20 ~ 10.2 GB < 12 GB ceiling
  rays: exif                     # exif: points = model depth x EXIF rays (focal verified by vanishing points, E12)
                                 # model: MapAnything's own rays (focal ~12% long -> ceilings 6-12% low)
                                 # joint + exif: ceilings -0.1% / +0.6%, walls 5 of 6 within 1.5% (E15, D20)
  f_scale: 1.0                   # multiplies the EXIF focal fed to the model (E13 experiment only)
  conf_percentile: 30            # drop the least confident 30% of masked pixels per run (as in E7-E11)
  voxel_m: 0.02                  # thin the merged cloud to a 2 cm grid
  sigma_log_floor_photo: 0.05    # minimum scale uncertainty (log space) until calibrated; per-room scale spread ~5% (E14, E15)

cache:
  dir: .cache                    # model outputs, keyed by input hashes + settings (gitignored)

alignment:
  normal_radius_m: 0.10            # neighbourhood for point normals
  horizontal_normal_deg: 25        # floor/ceiling candidates: normal within 25 deg of up
  wall_normal_max_z: 0.2           # wall candidates: |n_z| < 0.2
  height_bin_m: 0.01               # height histogram bin
  peak_rel: 0.15                   # a floor/ceiling peak holds >= 15% of the biggest horizontal peak
  plane_core_m: 0.03               # plane direction from the dominant copy only: |h - peak| < 3 cm
  plane_band_m: 0.05               # layer margin on the open side of a floor (below) / ceiling (above)
  plane_layer_m: 0.12              # layer depth into the room: holds every view's copy of a slightly doubled surface
  min_ceiling_m: 1.8               # ceiling at least this far above the floor
  max_floor_ceiling_angle_deg: 3   # average floor + ceiling normals only if they agree this well
  max_view_off_axis_deg: 8         # a photo whose walls sit further off the house axes is misplaced (good: 2-5 deg, E16)

layout:
  wall_min_z_m: 0.30               # wall points: vertical surfaces from 0.3 m ...
  wall_below_ceiling_m: 0.15       # ... up to 15 cm under the ceiling
  wall_normal_max_z: 0.5           # vertical surface: |n_z| < 0.5
  floor_max_z_m: 0.10              # floor points (pick the room's free-space component)
  cell_m: 0.02                     # 2D grid
  max_rays_per_view: 25000         # lines of sight carved per photo
  ray_stop_short_m: 0.06           # stop each ray this short of its surface
  min_views_free: 1                # a cell is free if at least this many photos saw through it
  free_gap_fill_m: 0.10            # merge neighbouring lines of sight (they fan out near far walls)
  neck_cut_m: 0.70                 # cut doorway necks narrower than this (per-room runs; joint runs use ownership)
  regularise_open_m: 0.60          # remove thin protrusions (doorway stubs) narrower than this
  regularise_close_m: 1.00         # fill concave gaps narrower than this between opposite edges
  notch_max_area_m2: 0.60          # inward corner steps smaller than this are filled (corner furniture / unseen corner)
  notch_max_len_m: 1.00            # ... if both step edges are shorter than this
  min_wall_points: 500             # fewer -> bounding-rectangle fallback
  min_room_area_m2: 1.5
  min_edge_m: 0.15                 # outline jogs shorter than this are removed
  refine_window_m: [0.10, 0.35]    # wall = median of wall points from 10 cm inside to 35 cm outside the outline
  coverage_window_m: 0.12          # wall coverage: vertical-surface points within 12 cm of the wall line ...
  coverage_min_points: 5           # ... at least this many per 10 cm of wall
  open_max_coverage: 0.50          # below this on BOTH rooms' faces = open boundary (no wall). Walls: 0.76-1.0 (home01)

uncertainty:
  interval_level: 0.90             # every [lo, hi] is a nominal 90% interval
  k_tier: {photo: 1.5, video: 1.5, lidar: 1.5}   # inflation; conservative until calibrated (step 1.10)
  sigma_geom_m: {photo: 0.03, video: 0.02, lidar: 0.01}  # local geometry noise per tier
  sigma_extra_m:
    weak_wall: 0.10                # a wall with < 20 supporting points: position from the outline only
    fallback_layout: 0.20          # bounding-rectangle fallback

stitch:
  adjacency_max_gap_m: 0.35        # two rooms' walls this close and parallel = shared wall (wall thickness + error)
  adjacency_min_overlap_m: 0.50    # ... overlapping along at least this length
  overlap_tolerance_m2: 0.02       # polygon intersections smaller than this are numerical noise
  snap_walls: true                 # structural wall snapping in a shared frame (drift correction, D25); off = ablation
  wall_thickness_m: 0.12           # nominal wall thickness between two rooms' faces (O5)
  snap_tolerance_m: 0.25           # faces whose wall-centre estimates agree this well are one physical wall
  snap_max_along_gap_m: 0.50       # collinear outer walls: at most this far apart along the line

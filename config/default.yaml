# Every threshold the pipeline uses lives here (ARCHITECTURE §12). CLI flags override.

ingest:
  image_extensions: [.heic, .heif, .jpg, .jpeg, .png]
  min_images_per_room: 2
  max_images_per_room: 8          # more -> keep the sharpest N, warn
  working_max_side: 1024          # long side of the in-memory copy (backbone 518, detector 960)
  mixed_orientation: drop_minority  # one orientation per room (E7); minority shots dropped with a warning
  reject_non_main_lens: true       # photos not on the capture's main lens (its most common focal) are excluded (E20: 2 zoomed ultra-wide shots shrank the flat ~4.6%)
  lens_mix_tol: 0.10               # ... if their 35 mm focal differs from it by more than 10% (0.5x 13-16, 2x 48-52 mm)
  intrinsics:
    film_diagonal_mm: 43.27       # 35 mm-equivalent focal is defined on the film DIAGONAL (D18)
    default_f35_mm: 26.0          # iPhone main (1x) camera; used only if EXIF has no focal, with a warning
    main_lens_f35_range_mm: [22, 36]  # outside -> not a 1x lens, warn (1x: 24/26, Pro iPhones also 28/35; 0.5x ~13, 2x ~48)

geometry:
  backbone: mapanything
  amp_dtype: fp16                # MPS-friendly; bf16/fp32 also accepted by MapAnything
  memory_efficient: true
  joint: auto                    # auto: one joint run over all rooms if <= max_joint_views photos, else per room
                                 # joint shares one metric scale across rooms and ties rooms together (E9, E15)
  max_joint_views: 20            # measured peak: 14 views 8.1 GB, 17 views 9.14 GB (~0.35 GB/view) -> 20 ~ 10.2 GB < 12 GB ceiling
  rays: exif                     # exif: points = model depth x EXIF rays (focal verified by vanishing points, E12)
                                 # model: MapAnything's own rays (focal ~12% long -> ceilings 6-12% low)
                                 # joint + exif: ceilings -0.1% / +0.6%, walls 5 of 6 within 1.5% (E15, D20)
  depth_focal_fix: false           # true: depth x (true focal / model focal) per view, points rebuilt with the true focal (E22m)
                                   # refit: then a second model pass re-solves the poses for that depth (E22n)
  depth_focal_scale: 1.0           # experiments: true focal = K_exif x this (without re-running the model)
  rotate_portrait: false          # portrait frames go into the model turned 90 deg, outputs turned back (E22i)
  repose:                          # camera poses re-solved with the true focal (E22o; video.repose switches it on)
    enabled: false
    sift_features: 4000            # per frame, working resolution
    ratio: 0.75                    # SIFT ratio test
    min_matches: 20                # RANSAC-F matches for a frame pair to be tried
    min_inliers: 15                # 3D-3D inliers for a pair to count
    rel_tol: 0.05                  # 3D-3D RANSAC: a match agrees within this share of its depth
    scale_prior_log: 0.3           # per-frame scale prior: model depth as it is, +-30% (frames no pair reaches)
    rot_prior_weight: 2.0          # model rotation vs sqrt(inliers)-weighted pair rotations
    min_baseline_m: 0.3            # pairs used to measure the model's baseline squeeze (diagnostic + prior)
    sigma_pnp_m: 0.05              # pair relative position (weighted by sqrt(inliers))
    sigma_prior_m: 0.25            # time neighbours: model offset x measured stretch (bridges frames no pair reaches)
    huber_m: 0.10                  # robust reweighting of pair rows
                                   # absolute scale: median of the frames' votes f_true / f_model (no knob)
  max_aspect: null                 # long side centre-cropped to short side x this before the model (E22n: 1.333 = 3:4)
  pad_scale: null                  # frame centred on a black canvas this many times its size before the model (E22n)
  pad_to_aspect: null              # frame centred on a black canvas of this long/short ratio (E22s; video.pad_to_aspect)
  f_scale: 1.0                   # multiplies the EXIF focal fed to the model (E13 experiment only)
  conf_percentile: 30            # drop the least confident 30% of masked pixels per run (as in E7-E11)
  voxel_m: 0.02                  # thin the merged cloud to a 2 cm grid
  sigma_log_floor_photo: 0.05    # minimum scale uncertainty (log space) until calibrated; per-room scale spread ~5% (E14, E15)
  scale_vote: true               # photo: run scaled by the views' focal votes, median over rooms of median
                                 # log(f_exif / f_model); level from config/calibration.yaml (FIX_DECLARATION.md)

cache:
  dir: .cache                    # model outputs, keyed by input hashes + settings (gitignored)

alignment:
  normal_radius_m: 0.10            # neighbourhood for point normals
  horizontal_normal_deg: 25        # floor/ceiling candidates: normal within 25 deg of up
  wall_normal_max_z: 0.2           # wall candidates: |n_z| < 0.2
  height_bin_m: 0.01               # height histogram bin
  peak_rel: 0.15                   # a floor/ceiling peak holds >= 15% of the biggest horizontal peak
  plane_core_m: 0.03               # plane direction from the dominant copy only: |h - peak| < 3 cm
  plane_band_m: 0.05               # layer margin on the open side of a floor (below) / ceiling (above)
  plane_layer_m: 0.12              # layer depth into the room: holds every view's copy of a slightly doubled surface
  min_ceiling_m: 1.8               # ceiling at least this far above the floor
  max_floor_ceiling_angle_deg: 3   # average floor + ceiling normals only if they agree this well
  max_view_off_axis_deg: 8         # a photo whose walls sit further off the house axes is misplaced (good: 2-5 deg, E16)
  shared_floor_tol_m: 0.08         # joint run: a room floor further than this from the shared floor (z=0) was not seen
  ceiling_mismatch_warn_m: 0.10    # joint run: warn if a room's ceiling differs from the others' median by more

layout:
  wall_min_z_m: 0.30               # wall points: vertical surfaces from 0.3 m ...
  wall_below_ceiling_m: 0.15       # ... up to 15 cm under the ceiling
  wall_normal_max_z: 0.5           # vertical surface: |n_z| < 0.5
  floor_max_z_m: 0.10              # floor points (pick the room's free-space component)
  cell_m: 0.02                     # 2D grid
  max_rays_per_view: 25000         # lines of sight carved per photo
  ray_stop_short_m: 0.06           # stop each ray this short of its surface
  min_views_free: 1                # a cell is free if at least this many photos saw through it
  lintel_min_z_m: null             # wall points above this (door height) cut the free space: no carving through a door (E22n)
  lintel_min_points: 2             # ... per 2 cm cell
  lintel_close_m: 0.30             # ... gaps up to this along a wall line bridged (sparse points)
  free_gap_fill_m: 0.10            # merge neighbouring lines of sight (they fan out near far walls)
  neck_cut_m: 0.70                 # cut doorway necks narrower than this (per-room runs; joint runs use ownership)
  regularise_open_m: 0.60          # remove thin protrusions (doorway stubs) narrower than this
  regularise_close_m: 1.00         # fill concave gaps narrower than this between opposite edges
  notch_max_area_m2: 0.60          # inward corner steps smaller than this are filled (corner furniture / unseen corner)
  notch_max_len_m: 1.00            # ... if both step edges are shorter than this
  min_wall_points: 500             # fewer -> bounding-rectangle fallback
  min_room_area_m2: 1.5
  min_edge_m: 0.15                 # outline jogs shorter than this are removed
  min_wall_support: 20             # wall points needed to place a wall from data; fewer = position from the outline
  camera_wall_margin_m: 0.20       # an unseen wall is at least this far behind every camera (phone held in front of the body, E22f)
  refine_window_m: [0.10, 0.35]    # wall = median of wall points from 10 cm inside to 35 cm outside the outline
  coverage_window_m: 0.12          # wall coverage: vertical-surface points within 12 cm of the wall line ...
  coverage_min_points: 5           # ... at least this many per 10 cm of wall
  open_max_coverage: 0.50          # below this on BOTH rooms' faces = open boundary (no wall). Walls: 0.76-1.0 (home01)

uncertainty:
  interval_level: 0.90             # every [lo, hi] is a nominal 90% interval
  apply_scale_bias: true           # re-solved video, photo scale vote: plan x calibrated size factor (config/calibration.yaml, E22q)
  k_tier: {photo: 1.5, video: 1.5, lidar: 1.5}   # default inflation; config/calibration.yaml overrides per mode + type (D30)
  sigma_geom_m: {photo: 0.03, video: 0.02, lidar: 0.01}  # local geometry noise per tier
  sigma_extra_m:
    weak_wall: 0.10                # a wall with < 20 supporting points: position from the outline only
    fallback_layout: 0.20          # bounding-rectangle fallback

stitch:
  adjacency_max_gap_m: 0.35        # two rooms' walls this close and parallel = shared wall (wall thickness + error)
  adjacency_min_overlap_m: 0.50    # ... overlapping along at least this length
  overlap_tolerance_m2: 0.02       # polygon intersections smaller than this are numerical noise
  snap_walls: true                 # structural wall snapping in a shared frame (drift correction, D25); off = ablation
  wall_thickness_m: 0.12           # nominal wall thickness between two rooms' faces (O5)
  snap_tolerance_m: 0.25           # faces whose wall-centre estimates agree this well are one physical wall
  snap_max_along_gap_m: 0.50       # collinear outer walls: at most this far apart along the line
  same_line_max_offset_m: 1.00     # declared same line (hints.yaml): faces up to this far apart are still joined (beyond: the hint is wrong)
  door_width_tol_m: 0.15           # door matching: widths of the two sides agree this well
  door_match_margin_m: 0.25        # through-door depth must land inside the other room's outline (+ margin)
  door_match_min_score: 0.5        # share of through-door points that must agree
  link_placement: true             # video: place rooms from link frames (same points seen from both rooms) before doors (E22n)
  link_min_points: 12              # matched points with depth in both rooms' runs needed for a link placement
  link_inlier_m: 0.25              # RANSAC: a matched point agrees within this in x/y (far points carry ~5-10% depth error)
  link_snap_deg: 12                # rotation within this of a multiple of 90 deg snaps to it (rooms squared to the house axes)
  relayout_after_placement: true   # placed rooms share a frame: redo the layout with ownership of free space (E22n)
  link_scale_rel_tol: 0.05         # link size ratio (3D similarity): a point agrees within this share of its camera distance
  flat_scale: true                 # reposed video: one scale for the flat, rooms tied by the link size ratios (E22p)
  door_height_prior_m: null       # 2.05: each room's size from doors whose top was seen (doors 2.0-2.1 m; general, not tape), E22z
  door_height_sigma_m: 0.05       # spread of door heights between homes
  door_lintel_band_m: 0.20        # wall votes in this band above a door's top = its top was seen (else the view ended)
  joint_scale: false              # rooms of separate model runs put on one scale by one run over all rooms (E23b)

eval:
  wall_tolerance: {photo: 0.08, video: 0.03, lidar: 0.03}   # REQUIREMENTS §8: photo ±8%, video ±3%
  g2_ceiling_m: 0.015              # G2: ceiling error <= 1.5 cm
  g5_footprint_rel: 0.08           # G5: footprint within ±8%
  g1_width_m: 0.02                 # G1: opening width error <= 2 cm ...
  g1_pass_rate: 0.85               # ... on >= 85% of (measured + phantom) openings

openings:
  cell_u_m: 0.02                   # vote grid along the wall
  cell_z_m: 0.05                   # vote grid up the wall
  depth_margin_m: 0.15             # depth beyond the wall by more than this = seen through
  min_open_ratio: 0.6              # a cell is open if open votes / (open + wall votes) >= this
  min_votes: 1                     # ... and at least this many photos saw through it
  min_width_m: 0.40                # smaller see-through patches are noise
  min_height_m: 0.40
  max_width_m: 2.50                # wider = not a single opening
  min_window_m: 0.50               # windows: at least 0.5 x 0.5 m ...
  min_window_views: 2              # ... and seen through by 2+ photos (single-photo patches are noise)
  sigma_width_m: 0.03              # opening edge uncertainty (cell size + jamb definition)
  floor_gap_m: 0.25                # an opening starting this close to the floor reaches the floor (door / doorway)
  lintel_min_m: 0.25               # door top further than this below the ceiling = lintel (door); else an opening
  min_door_height_m: 1.6           # a floor-reaching opening whose top was seen lower than this is not a doorway (detector too)

detector:                          # OWLv2 open-vocabulary detector (one pass per photo, cached)
  image_side: 960                  # OWLv2 works at 960 px
  classes:                         # class -> text queries; class threshold (tuned on the benchmark, O4)
    water_stain: {queries: [water stain on a wall, brown stain on a wall, damp patch on a wall], threshold: 0.20}
    crack:       {queries: [crack in a wall, hairline crack], threshold: 0.20}
    door:        {queries: [a door, a closed door], threshold: 0.25}
    window:      {queries: [a window], threshold: 0.25}
    mirror:      {queries: [a mirror], threshold: 0.30}
  nms_iou: 0.3

damage:
  max_surface_dist_m: 0.25         # a detection's centre must lie this close to a wall / floor / ceiling
  merge_iou: 0.3                   # same damage seen in several photos: same surface, overlap above this
  fill: {water_stain: 0.6, crack: 0.1}   # area = width x height x fill (box extent overestimates, ARCHITECTURE §10.10)
  sigma_extent_m: 0.05             # box-edge uncertainty of a damage extent
  min_photos: 2                    # keep only things seen in >= 2 different photos at the same place
  surfaces: [wall, ceiling]        # marble / patterned floors produce stain & crack false positives (E18)

calibration_fit:                   # scan-calibrate (D30)
  k_min: 0.5                       # never narrower than this, whatever few residuals say
  small_n_inflate: 2.0             # too few residuals for the conformal quantile: max ratio x this
  min_room_measurements: 3         # size bias: a room enters only with >= 3 taped measurements (median robust to 1 bad)

video:
  decode_fps: 4                    # candidate frames per second
  keyframes_per_room: 12           # per room; more rooms x frames than geometry.max_joint_views -> per-room runs + door stitching
  min_sharpness: 30                # Laplacian variance; blurrier slices give no keyframe
  min_keyframe_gap_s: 1.0          # keyframes at least this far apart (video_c picked 69.0 s and 69.2 s)
  link_frames_per_pair: 2          # per pair of rooms: frame pairs where both clips see the same thing (doorway / the room
                                   # beyond it), added to both rooms' keyframes; they tie rooms together (E22l). 0 = off
  link_fps: 1.0                    # link candidates per second of video
  link_side_px: 480                # SIFT on candidates at this long side
  link_min_inliers: 30             # RANSAC-verified SIFT matches for a link (real links 46-69, E22l)
  link_spread_s: 5.0               # links of one room pair at least this far apart in time (in one of the rooms)
  max_joint_views: 30              # overrides geometry.max_joint_views for video: 16:9 frames carry ~25% fewer model tokens
                                   # than 4:3 photos; 24 views peaked at 9.15 GB (E22k)
  repose: false                    # camera poses re-solved with the true focal (geometry.repose, E22o)
  pad_to_aspect: 1.3333            # 16:9 frames on a 4:3 canvas; the model then reads the focal within ~10% (E22s)
  door_height_prior_m: 2.05        # each room's size from doors whose top was seen (E22z); video only
                                   # final video config (user, 2026-10-05): with these two, home01_video_e has no
                                   # overlaps and its footprint is -4.4% (defaults off: 2 overlaps, -18.3%)
  extra_keyframes: []             # frame names (<clip>_t<seconds>) added to the time-sliced keyframes (E22u: chosen for coverage)
  rays: model                      # overrides geometry.rays for video: MapAnything ignores the given video focal and keeps
                                   # its own (~22 mm vs ~30-33 by VP); EXIF rays then break multi-view consistency.
                                   # model rays: ceilings 2.16/1.94 -> 2.83/2.91 m (tape 2.79/2.80), E22c
  force_f35_mm: null               # set to skip the vanishing-point estimate (known video focal; E22 experiments)
  default_f35_mm: 32.0             # fallback only: iPhone 13 1x video measured ~31.9 mm by vanishing points (16:9 + stabilisation crop)
  vp_frames_per_clip: 20           # sharpest frames per clip used to estimate the focal
  min_vp_frames: 3                 # keyframes with a valid vanishing-point focal needed to trust it
